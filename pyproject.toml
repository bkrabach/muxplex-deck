[project]
name = "muxplex-deck"
version = "0.6.1"
description = "Hardware probe/diagnostic app for the Elgato Stream Deck+ (seed of the muxplex sidecar)"
readme = "README.md"
authors = [
    { name = "Amplifier", email = "240397093+microsoft-amplifier@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "streamdeck>=0.9.5",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "muxplex-client>=0.19.0",
]

[project.scripts]
deck-probe = "deck_probe.main:main"
muxplex-deck = "muxplex_deck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
markers = [
    "allow_real_subprocess: test intentionally exercises the real subprocess.run (see tests/conftest.py)",
    "allow_real_hid: test intentionally exercises the real device_real.RealDeviceManager (see tests/conftest.py)",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["deck_probe", "muxplex_deck"]
module-root = "src"

[tool.pyright]
venvPath = "."
venv = ".venv"
