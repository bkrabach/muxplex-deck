[project]
name = "muxplex-deck"
version = "0.1.0"
description = "Hardware probe/diagnostic app for the Elgato Stream Deck+ (seed of the muxplex sidecar)"
readme = "README.md"
authors = [
    { name = "Amplifier", email = "240397093+microsoft-amplifier@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "streamdeck>=0.9.5",
    "pillow>=10.0.0",
]

[project.scripts]
deck-probe = "deck_probe.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deck_probe"
module-root = "src"

[tool.pyright]
venvPath = "."
venv = ".venv"
